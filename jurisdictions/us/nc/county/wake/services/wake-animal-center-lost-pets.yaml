id: wake-animal-center-lost-pets
title: Find a lost pet or adopt one (Wake County Animal Center)
summary: >-
  The Wake County Animal Center is the county's shelter. Pets picked up by Raleigh Animal Control
  that can't be returned go there. It handles lost and found pets and adoptions.
