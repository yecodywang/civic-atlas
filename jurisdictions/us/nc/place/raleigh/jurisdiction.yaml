name: City of Raleigh
kind: place
aliases: [raleigh]
overlaps:
  - id: us/nc/county/wake
    primary: true
    notes: Most of Raleigh is in Wake County.
  - id: us/nc/county/durham
    notes: >-
      A small part of Raleigh is in Durham County. Residents there get county services, including
      property tax bills and schools, from Durham County.
websites:
  - label: City of Raleigh
    url: https://raleighnc.gov/
  - label: Ask Raleigh (report problems and request services)
    url: https://ask.raleighnc.gov/ask
  - label: Frequently called numbers
    url: https://raleighnc.gov/ask-raleigh-fix-report-request/services/frequently-called-numbers
key_contacts:
  - type: phone
    label: Raleigh Police non-emergency
    phone: 919-829-1911
    purpose: Police help that is not an emergency.
    notes: Raleigh Fire's contact page also lists 919-996-3335 as "Police (non-emergencies)".
  - type: phone
    label: Raleigh Fire non-emergency (Fire Administration)
    phone: 919-996-6115
  - type: phone
    label: Raleigh Police Animal Control
    phone: 919-831-6311
  - type: phone
    label: City of Raleigh general line ("who to call for everything else")
    phone: 919-996-3000
    notes: TDD 919-996-3107
    purpose: Not sure who handles something? Start here.
  - type: phone
    label: Raleigh Water customer care and billing
    phone: 919-996-3245
    purpose: Water bills, missed trash pickup, and water or sewer emergencies (24/7).
  - type: web
    label: Ask Raleigh
    url: https://ask.raleighnc.gov/ask
    purpose: Report a problem or request a City service online, and track it.
notes:
  - >-
    The City of Raleigh does not run a health department. In North Carolina, counties provide
    public health services (N.C.G.S. 130A-34), so Raleigh residents use Wake County Public Health
    (or Durham County's, in the Durham County part of the city).
stewards: [yecodywang]
provenance:
  source_urls:
    - https://raleighnc.gov/ask-raleigh-fix-report-request/services/frequently-called-numbers
    - https://raleighnc.gov/police
    - https://raleighnc.gov/fire/services/emergency-contacts-and-faq
    - https://raleighnc.gov/animal-control
    - https://raleighnc.gov/government/news/ask-raleigh-launches-july-1
    - https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/BySection/Chapter_130A/GS_130A-34.html
  last_checked: 2026-11-04
