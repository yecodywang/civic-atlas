# "Who do I contact?" for the City of Raleigh.
# Non-emergency situations only: civic-atlas does not route emergencies
# (docs/adr/0003-non-emergency-scope.md).
# Rules are matched by keyword; more keyword hits rank higher. Keep keywords short and plain.
rules:
  - id: police-non-emergency
    situation: Non-emergency police help (reporting a past crime, suspicious activity, a question for police)
    keywords: [police, non emergency, suspicious, stolen, theft, police report, broken into, broke into, file a report]
    go_to: Raleigh Police non-emergency line
    jurisdiction: us/nc/place/raleigh
    channel:
      type: phone
      label: Raleigh Police non-emergency
      phone: 919-829-1911
    explanation: The Raleigh Police non-emergency line handles police matters that aren't emergencies.
  - id: noise
    situation: Loud music, a party, or other noise
    keywords: [noise, loud, music, party, barking, amplified sound]
    go_to: Raleigh Police non-emergency line
    jurisdiction: us/nc/place/raleigh
    service: report-noise
    explanation: Raleigh Police handle noise complaints through the non-emergency line.
  - id: trash-recycling
    situation: Missed garbage, recycling or yard waste pickup
    keywords: [trash, garbage, recycling, yard waste, missed pickup, cart, bin, not picked up]
    go_to: City of Raleigh Solid Waste Services
    jurisdiction: us/nc/place/raleigh
    service: report-missed-collection
    explanation: The City collects household trash, recycling and yard waste.
  - id: bulky-items
    situation: Getting rid of furniture, a mattress or other large items
    keywords: [bulky, furniture, mattress, couch, sofa, large item, appliance, tv, television, electronics, e waste]
    go_to: City of Raleigh Solid Waste Services
    jurisdiction: us/nc/place/raleigh
    service: schedule-bulky-item-pickup
    explanation: The City picks up bulky items by appointment for a fee.
  - id: state-road
    situation: A problem on a highway, Interstate, or other State-maintained road
    keywords: [highway, interstate, ncdot, state road, i-40, i-440, guardrail, us 1, capital boulevard]
    go_to: NC Department of Transportation (NCDOT)
    jurisdiction: us/nc
    service: report-state-road-problem
    explanation: NCDOT maintains Interstates and U.S., N.C. and SR routes, even inside Raleigh.
  - id: streets
    situation: A pothole or damaged street
    keywords: [pothole, street damage, road, pavement, damaged street]
    go_to: City of Raleigh street maintenance
    jurisdiction: us/nc/place/raleigh
    service: report-pothole
    explanation: The City repairs City-maintained streets. Some major roads are maintained by the State (NCDOT).
  - id: sidewalks
    situation: A broken or uneven sidewalk
    keywords: [sidewalk, trip hazard, uneven]
    go_to: City of Raleigh sidewalk repair
    jurisdiction: us/nc/place/raleigh
    service: report-sidewalk-damage
    explanation: The City's sidewalk repair team handles damaged sidewalks.
  - id: streetlights
    situation: A streetlight is out or broken
    keywords: [streetlight, street light, light out, dark street, lamp post]
    go_to: The electric utility (usually Duke Energy)
    service: report-streetlight-out
    explanation: Most Raleigh streetlights are maintained by the power company, not the City.
  - id: graffiti
    situation: Graffiti on a wall, sign or building
    keywords: [graffiti, spray paint, tagging, vandalism]
    go_to: City of Raleigh street maintenance
    jurisdiction: us/nc/place/raleigh
    service: report-graffiti
    explanation: The City removes graffiti and takes reports through Ask Raleigh.
  - id: abandoned-vehicle
    situation: A car that seems abandoned
    keywords: [abandoned car, abandoned vehicle, junk car, car left]
    go_to: Raleigh Police (City streets) or City Code Enforcement (private property)
    jurisdiction: us/nc/place/raleigh
    service: report-abandoned-vehicle
    explanation: Who handles it depends on whether the car is on a public street or on private property.
  - id: flooding
    situation: Street flooding, a clogged storm drain or drainage problem
    keywords: [flooding, flood, storm drain, drainage, standing water, clogged drain, catch basin]
    go_to: City of Raleigh Stormwater
    jurisdiction: us/nc/place/raleigh
    service: report-flooding-drainage
    explanation: The City's stormwater team handles storm drains and street drainage.
  - id: water-sewer-emergency
    situation: A water main break, leaking fire hydrant, sewer backup or no water
    keywords: [water main, water leak, leaking, hydrant, sewer, sewage, manhole, no water, discolored water, low water pressure]
    go_to: Raleigh Water (24/7)
    jurisdiction: us/nc/place/raleigh
    service: report-water-sewer-problem
    channel:
      type: phone
      label: Raleigh Water, water or sewer emergencies (24/7)
      phone: 919-996-3245
    explanation: Raleigh Water handles water and sewer problems at any hour, including leaking fire hydrants.
  - id: water-bill
    situation: Paying or asking about a water or utility bill
    keywords: [water bill, utility bill, pay bill, autopay, sewer bill, utility account]
    go_to: Raleigh Water customer care and billing
    jurisdiction: us/nc/place/raleigh
    service: pay-utility-bill
    explanation: The City of Raleigh bills water, sewer and some other utility services.
  - id: property-tax
    situation: A question about a property tax bill
    keywords: [property tax, tax bill, real estate tax, home value, assessment, appraisal]
    go_to: Wake County Tax Administration
    jurisdiction: us/nc/county/wake
    service: property-tax-bill
    explanation: >-
      Raleigh sets its own tax rate, but Wake County sends and collects the bill, with a line for
      the City. (In the Durham County part of Raleigh, Durham County bills instead.)
  - id: tax-relief
    situation: Help paying property tax as a senior, a person with a disability, or a disabled veteran
    keywords: [tax relief, senior, elderly, disabled veteran, can't afford property tax]
    go_to: Wake County Tax Administration (tax relief programs)
    jurisdiction: us/nc/county/wake
    service: property-tax-relief
    explanation: Wake County runs the State's property tax relief programs for qualifying homeowners.
  - id: help-with-needs
    situation: Help with food, rent, utilities or other basic needs
    keywords: [food, rent, utility assistance, help paying, assistance]
    go_to: NC 211 (United Way of North Carolina)
    jurisdiction: us/nc
    service: nc-211
    explanation: NC 211 connects people with health and human services near them. It's free and confidential.
  - id: public-health
    situation: Health care from the public health department (clinics, family planning, prenatal, dental)
    keywords: [health department, public health, health clinic, clinic, family planning, birth control, prenatal, dental, dentist, tb test, well child]
    go_to: Wake County Public Health
    jurisdiction: us/nc/county/wake
    service: public-health-clinics
    explanation: >-
      The City of Raleigh has no health department. In North Carolina, counties run public health,
      so Wake County Public Health serves Raleigh.
  - id: low-cost-doctor
    situation: Finding a doctor without insurance
    keywords: [no insurance, uninsured, free clinic, low cost, find a doctor, doctor, primary care, sliding scale]
    go_to: Nonprofit and community clinics (Wake County's list and referral line)
    jurisdiction: us/nc/county/wake
    service: low-cost-primary-care
    explanation: Wake County Public Health lists nonprofit and community clinics that serve uninsured patients.
  - id: vaccines
    situation: Vaccines or shots, including school-required shots and flu shots
    keywords: [vaccine, vaccination, immunization, shot, flu shot, shot record]
    go_to: Wake County Public Health
    jurisdiction: us/nc/county/wake
    service: get-vaccinations
    explanation: Wake County Public Health gives vaccines for children and adults.
  - id: sexual-health-testing
    situation: HIV, STI or hepatitis C testing
    keywords: [hiv, std, sti, syphilis, chlamydia, gonorrhea, hepatitis, prep]
    go_to: Wake County Public Health
    jurisdiction: us/nc/county/wake
    service: hiv-sti-testing
    explanation: Wake County Public Health offers free, confidential testing.
  - id: wic
    situation: Food and nutrition help for pregnant women, new mothers and young children
    keywords: [wic, formula, breastfeeding, pregnant, baby food]
    go_to: Wake County WIC
    jurisdiction: us/nc/county/wake
    service: wic-nutrition-program
    explanation: Wake County Public Health runs the WIC program.
  - id: medicaid
    situation: Health coverage through Medicaid
    keywords: [medicaid, health insurance, health coverage]
    go_to: Wake County Health & Human Services (NC Medicaid)
    jurisdiction: us/nc/county/wake
    service: apply-for-medicaid
    explanation: Wake County Health & Human Services handles Medicaid applications for the State's program.
  - id: dead-animal
    situation: A dead animal on a street, in the right of way, or at the curb
    keywords: [dead, dead animal, dead deer, roadkill, carcass]
    go_to: City of Raleigh (Ask Raleigh dead animal removal)
    jurisdiction: us/nc/place/raleigh
    service: report-dead-animal
    explanation: The City collects dead animals on City streets and at the curb.
  - id: animal-control
    situation: A stray, injured, vicious or abandoned animal, or problem wildlife
    keywords: [stray, loose dog, injured animal, vicious, barking dog, wildlife, raccoon, animal control, animal cruelty]
    go_to: Raleigh Police Animal Control
    jurisdiction: us/nc/place/raleigh
    service: report-animal-problem
    explanation: Animal Control is part of the Raleigh Police Department.
  - id: lost-pet
    situation: A lost or found pet, or adopting a pet
    keywords: [lost pet, lost dog, lost cat, missing pet, missing dog, missing cat, found dog, found cat, adopt, animal shelter, pet, cat]
    go_to: Wake County Animal Center
    jurisdiction: us/nc/county/wake
    service: wake-animal-center-lost-pets
    explanation: Wake County runs the animal shelter, where unclaimed pets picked up in Raleigh go.
  - id: code-enforcement
    situation: Overgrown grass, junk in a yard, or unsafe rental housing
    keywords: [overgrown, grass, tall grass, weeds, junk, unsafe housing, landlord, housing code, code enforcement, nuisance]
    go_to: City of Raleigh Code Enforcement
    jurisdiction: us/nc/place/raleigh
    service: report-code-violation
    explanation: The City's Code Enforcement Division handles public nuisances and housing code complaints.
  - id: traffic-signals-signs
    situation: A broken traffic light, a downed or missing street sign, or faded markings
    keywords: [traffic light, traffic signal, signal out, stop sign, street sign, faded, crosswalk]
    go_to: City of Raleigh Transportation
    jurisdiction: us/nc/place/raleigh
    service: report-traffic-signal-or-sign
    explanation: The City maintains signals and signs on City streets; NCDOT handles State roads.
  - id: speeding
    situation: Speeding or cut-through traffic on a neighborhood street
    keywords: [speeding, speed, speeder, speed hump, speed bump, traffic calming, cut through]
    go_to: City of Raleigh Neighborhood Traffic Management
    jurisdiction: us/nc/place/raleigh
    service: request-traffic-calming
    explanation: The City's Neighborhood Traffic Management program reviews these requests.
  - id: online-police-report
    situation: Filing a police report for a minor crime with no suspect present
    keywords: [file a report, police report, stolen, theft, broken into, lost property, identity theft, hit and run]
    go_to: Raleigh Police online reporting
    jurisdiction: us/nc/place/raleigh
    service: report-crime-online
    explanation: Raleigh Police takes some reports online; others go through the non-emergency line.
  - id: fire-hazard
    situation: A non-urgent fire hazard or fire code violation, or a fire safety program request
    keywords: [fire hazard, fire code, blocked exit, fire marshal, fire station tour, fire safety class]
    go_to: Raleigh Fire, Office of the Fire Marshal
    jurisdiction: us/nc/place/raleigh
    service: report-fire-hazard
    explanation: The Office of the Fire Marshal handles fire hazards, code violations and safety education.
  - id: permits-zoning
    situation: Building permits, inspections, zoning or development questions
    keywords: [permit, building permit, inspection, zoning, rezoning, development, contractor]
    go_to: City of Raleigh Planning and Development (Permit Helpline)
    jurisdiction: us/nc/place/raleigh
    service: get-permit-help
    explanation: Planning and Development handles permits, inspections and zoning inside Raleigh.
  - id: public-records
    situation: Requesting City records
    keywords: [public records, records request, foia, city documents]
    go_to: City of Raleigh Public Records Portal
    jurisdiction: us/nc/place/raleigh
    service: request-public-records
    explanation: City records are requested through the City's portal.
  - id: vital-records
    situation: Birth, death or marriage certificates, marriage licenses, or deeds
    keywords: [birth certificate, death certificate, marriage, deed, vital records]
    go_to: Wake County Register of Deeds
    jurisdiction: us/nc/county/wake
    service: birth-death-marriage-certificates
    explanation: These records are kept by the County, not the City.
  - id: voting
    situation: Registering to vote, finding a polling place, or voting by mail
    keywords: [vote, voting, register to vote, polling place, ballot, election]
    go_to: Wake County Board of Elections
    jurisdiction: us/nc/county/wake
    service: register-to-vote
    explanation: Elections are run by the County Board of Elections, not the City.
  - id: snap
    situation: Food benefits (SNAP or food stamps)
    keywords: [snap, food stamp, stamp, ebt, food benefit, snap benefit]
    go_to: Wake County Health & Human Services (Food and Nutrition Services)
    jurisdiction: us/nc/county/wake
    service: food-nutrition-services
    explanation: Wake County handles Food and Nutrition Services applications.
  - id: seniors
    situation: Help for an older adult or an adult with a disability
    keywords: [elderly, aging parent, adult day, caregiver, adult protective, guardianship]
    go_to: Wake County Senior and Adult Services
    jurisdiction: us/nc/county/wake
    service: senior-adult-services
    explanation: Wake County provides services for older adults and adults with disabilities.
  - id: drop-off-trash
    situation: Taking trash, recycling or hazardous waste somewhere yourself
    keywords: [convenience center, dump, drop off, hazardous waste, paint, chemicals, batteries, take my trash]
    go_to: Wake County convenience centers and household hazardous waste sites
    jurisdiction: us/nc/county/wake
    service: convenience-centers
    explanation: Wake County runs drop-off sites that Raleigh residents can use.
  - id: car-tax
    situation: Vehicle property tax or registration renewal
    keywords: [car, car tax, vehicle tax, tag and tax, registration renewal, license plate]
    go_to: NC DMV and Wake County Tax Administration
    jurisdiction: us/nc
    service: vehicle-property-tax
    explanation: Vehicle property tax is paid to NC DMV with your registration renewal.
  - id: neighborhood-groups
    situation: Neighborhood groups, grants, borrowing tools, or volunteering
    keywords: [neighborhood association, hoa, neighborhood grant, tool share, borrow, volunteer]
    go_to: City of Raleigh Community Engagement
    jurisdiction: us/nc/place/raleigh
    service: neighborhood-registry
    explanation: Community Engagement runs the Neighborhood Registry, neighborhood funds, Tool Share and Volunteer Raleigh.
  - id: tech-help
    situation: Free help using a phone, tablet or computer
    keywords: [computer help, phone help, tech help, device, digital, smartphone, using my phone, help using, tablet]
    go_to: City of Raleigh Digital Impact (Advice About Your Device) and Parks Digital Inclusion classes
    jurisdiction: us/nc/place/raleigh
    service: digital-help
    explanation: The City offers free drop-in device help and computer classes.
  - id: homeless
    situation: Homelessness or losing your housing
    keywords: [homeless, homelessness, eviction, evicted, evict, losing my home, place to stay, homeless shelter]
    go_to: Coordinated entry access sites and service centers such as Oak City Cares
    jurisdiction: us/nc/place/raleigh
    service: housing-crisis-help
    explanation: The City lists service centers, meals, showers and the coordinated entry process.
  - id: green-stormwater
    situation: A rain garden, cistern or other project to manage rainwater on your property
    keywords: [rain garden, cistern, rain barrel, rainwater, green roof, downspout, permeable]
    go_to: City of Raleigh Stormwater (Raleigh Rainwater Rewards)
    jurisdiction: us/nc/place/raleigh
    service: rainwater-rewards
    explanation: Raleigh Rainwater Rewards pays most of the cost of eligible projects.
  - id: mulch-compost
    situation: Buying mulch or compost, or dropping off extra yard waste
    keywords: [mulch, compost, wood chips, yard waste center, drop off yard waste]
    go_to: City of Raleigh Yard Waste Center
    jurisdiction: us/nc/place/raleigh
    service: yard-waste-center
    explanation: The City's Yard Waste Center sells compost and mulch and takes yard waste for a fee.
  - id: home-repair
    situation: Help paying for home repairs, or buying a first home
    keywords: [home repair, roof, repair loan, homebuyer, down payment, buy a house]
    go_to: City of Raleigh Housing and Community Development
    jurisdiction: us/nc/place/raleigh
    service: home-repair-programs
    explanation: The City has income-qualified repair and homebuyer programs that open and close during the year.
  - id: smoke-alarm
    situation: Getting a free smoke alarm
    keywords: [smoke alarm, smoke detector]
    go_to: Raleigh Fire Department
    jurisdiction: us/nc/place/raleigh
    service: request-smoke-alarm
    explanation: Raleigh Fire installs smoke alarms for residents.
  - id: alerts
    situation: Getting news and emergency alerts
    keywords: [alert, alerts, notification, news, newsletter, text me, sign up]
    go_to: MyRaleigh Subscriptions (City news) and ReadyWake Alerts (emergencies)
    jurisdiction: us/nc/place/raleigh
    service: myraleigh-subscriptions
    explanation: City news comes through MyRaleigh Subscriptions. Wake County's ReadyWake Alerts handles emergency alerts.
  - id: parks-programs
    situation: Parks, classes, camps, or reserving a shelter
    keywords: [park, class, camp, reclink, picnic shelter, picnic, community center, greenway, program]
    go_to: City of Raleigh Parks, Recreation and Cultural Resources
    jurisdiction: us/nc/place/raleigh
    service: reclink-register-program
    explanation: Raleigh Parks runs programs and rentals through RecLink.
  - id: have-a-say
    situation: Having a say in City decisions
    keywords: [council, survey, feedback, public comment, board, commission, have a say]
    go_to: Engage Raleigh, City Council public comment, or boards and commissions
    jurisdiction: us/nc/place/raleigh
    service: engage-raleigh-surveys
    explanation: You can comment on projects online, speak at Council meetings, or volunteer on a board.
  - id: court-traffic
    situation: Court dates, traffic tickets or questions for the District Attorney
    keywords: [court, court date, traffic ticket, speeding ticket, district attorney]
    go_to: The courts in Wake County (part of the State court system, the NC Judicial Branch)
    jurisdiction: us/nc
    channel:
      type: web
      label: NC Courts, Wake County contact directory
      url: https://www.nccourts.gov/locations/wake-county/contact-directory
    explanation: >-
      North Carolina's courts are run by the State, not the City or County, even though the
      courthouse is in Raleigh. The Raleigh Police information desk doesn't handle court dates or
      traffic tickets. (The City's frequently called numbers page lists 919-755-4117 for these
      questions; it hasn't been confirmed against the courts' own directory.)
fallback:
  go_to: City of Raleigh general line ("who to call for everything else")
  channel:
    type: phone
    label: City of Raleigh general line
    phone: 919-996-3000
    notes: TDD 919-996-3107
  explanation: Not sure who handles it? The City's general line can point you to the right place, including County or State offices.
provenance:
  source_urls:
    - https://raleighnc.gov/ask-raleigh-fix-report-request/services/frequently-called-numbers
    - https://raleighnc.gov/police
    - https://www.wake.gov/departments-government/tax-administration
    - https://www.nccourts.gov/locations/wake-county/contact-directory
  last_checked: 2026-11-04
  notes: >-
    nccourts.gov blocks automated clients, so the court directory link was found by web search and
    still needs a person to open it.
