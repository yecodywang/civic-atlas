id: text-911
title: Text 911 when you can't safely call
summary: >-
  In Raleigh and Wake County you can text 911, including photos and video, if calling isn't safe
  or possible. Call when you can; text when you can't.
provider: Raleigh-Wake Emergency Communications Center
category: contact
core_skill: know-who
aliases: [text 911, text to 911, deaf, hard of hearing, can't talk, cannot speak, silent emergency]
channels:
  - type: text
    label: Text 911
    phone: "911"
steps:
  online:
    - Open a new text message and type 911 in the "To" field.
    - In the first message, say where you are and what kind of help you need.
    - Send it, then answer the call taker's questions and follow their directions.
    - Use plain words, no abbreviations or emojis.
notes:
  - Texts can be delayed, arrive out of order, or not arrive. Call whenever you can.
  - Texting 911 doesn't work while roaming and needs a text or data plan. Don't add anyone else to the message.
  - If texting isn't available, you'll get a reply telling you to contact 911 another way.
related: [ask-raleigh]
provenance:
  source_urls:
    - https://raleighnc.gov/safety/services/911-call-when-you-can-text-if-you-cant
  last_checked: 2026-11-04
