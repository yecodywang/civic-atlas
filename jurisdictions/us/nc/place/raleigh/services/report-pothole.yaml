id: report-pothole
title: Report a pothole or damaged street
summary: >-
  Tell the City about a pothole or other damage on a City-maintained street. Some roads in
  Raleigh are maintained by the State (NCDOT), not the City.
provider: City of Raleigh Transportation (street maintenance)
category: fix-report
core_skill: report-request
aliases: [pothole, potholes, hole in the road, street damage, damaged street, road repair, cracked pavement]
channels:
  - type: web
    label: Ask Raleigh (Transportation & Mobility > Potholes, Sinkholes & Pavement)
    url: https://ask.raleighnc.gov/ask
  - type: phone
    label: Street maintenance
    phone: 919-996-6446
  - type: web
    label: Map of who maintains each street
    url: http://ral.maps.arcgis.com/apps/webappviewer/index.html?id=7f522ff4b033436b8b3fc2c7cf1f3f81
    purpose: Check whether the City maintains the street.
what_you_need:
  - The street address or nearest intersection
  - A photo, if it is safe to take one
steps:
  online:
    - Open Ask Raleigh and choose the pothole repair request.
    - Mark the location on the map or type the address.
    - Describe the size and where it is in the road (for example, the right lane).
    - Submit and save your request number.
  call:
    - Call 919-996-6446.
    - Give the address or nearest intersection and describe the problem.
notes:
  - Don't stop in traffic to take a photo.
  - The Ask Raleigh form lists an estimated delivery time of 30 days. A worn-out street that needs repaving is a separate request (Street Resurfacing); a gravel or dirt street is "Unpaved Street".
  - If a road is actively collapsing or a sinkhole is large or growing, the form says to call the non-emergency number, 919-829-1911, right away.
  - Interstates and U.S., N.C. and SR routes are maintained by NCDOT even inside Raleigh. See the NCDOT entry.
related: [ask-raleigh, report-sidewalk-damage, report-flooding-drainage, report-state-road-problem]
provenance:
