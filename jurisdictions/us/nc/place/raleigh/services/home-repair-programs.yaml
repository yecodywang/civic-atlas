id: home-repair-programs
title: Learn about City home repair programs
summary: >-
  The City offers repair loans for income-qualified homeowners. Programs open and close, so check
  current status.
provider: City of Raleigh Housing and Neighborhoods (some programs run with Preserving Home)
category: find-help
aliases: [home repair, house repair, roof repair, rehab, housing help, limited repair, home revitalization]
referral_only: true
channels:
  - type: web
    label: Homeowner rehab and repair programs
    url: https://raleighnc.gov/housing/homeowner-rehab-and-repair-programs
  - type: phone
    label: Housing and Neighborhoods (rehab programs)
    phone: 919-996-4330
  - type: email
    label: Housing and Neighborhoods (rehab programs)
    email: Rehabs@raleighnc.gov
  - type: phone
    label: Preserving Home (Limited Repair and Home Revitalization programs)
    phone: 919-336-5200
eligibility: >-
  Income limits apply. As of the last check, the limit for a one-person household was $46,350
  (Limited Repair) or $60,255 (Home Revitalization).
notes:
  - As of the last check, the Substantial Rehabilitation Program (for homeowners 62 or older or with a disability) was not taking new applications.
  - The Limited Repair and Home Revitalization programs are run by Preserving Home, a partner organization.
related: [homebuyer-assistance, property-tax-relief, nc-211]
