id: report-graffiti
title: Report graffiti
summary: Ask the City to remove graffiti on public property, or get help with graffiti on your property.
provider: City of Raleigh Transportation (street maintenance)
category: fix-report
core_skill: report-request
aliases: [graffiti, vandalism, spray paint, tagging]
channels:
  - type: web
    label: Ask Raleigh (Graffiti Report Form)
    url: https://ask.raleighnc.gov/ask
  - type: phone
    label: Street maintenance
    phone: 919-996-6446
what_you_need:
  - The exact location (address, or which side of which building or wall)
  - A photo, if you can
steps:
  online:
    - Open Ask Raleigh and choose the graffiti report.
    - Mark the location and describe what and where the graffiti is.
    - Attach a photo and submit.
  call:
    - Call 919-996-6446 and describe the location.
notes:
  - If you see someone damaging property right now, call the police non-emergency line (919-829-1911), or 911 if anyone is in danger.
related: [ask-raleigh]
provenance:
  source_urls:
    - https://raleighnc.gov/fix-it-report-it-request-it/streets-maintenance-and-repairs
  last_checked: 2026-11-04
