id: report-streetlight-out
title: Report a streetlight that is out or damaged
summary: >-
  Report a streetlight outage in Ask Raleigh (Signs and Signals) and the City will route it, or
  report it straight to the electric utility that maintains most Raleigh streetlights (usually Duke
  Energy, sometimes Wake Electric).
provider: City of Raleigh Transportation, with Duke Energy or Wake Electric
provider_type: other
category: fix-report
core_skill: report-request
aliases: [streetlight, street light, light out, broken light, dark street, lamp post]
channels:
  - type: web
    label: Ask Raleigh (Transportation & Mobility > Signs and Signals)
    url: https://ask.raleighnc.gov/ask
  - type: web
    label: Duke Energy street and area light repair
    url: https://www.duke-energy.com/customer-service/request-light-repair
  - type: phone
    label: Duke Energy (streetlight repair)
    phone: 800-769-3766
  - type: phone
    label: Wake Electric Membership Corporation
    phone: 855-280-1147
  - type: phone
    label: City of Raleigh streetlight program
    phone: 919-996-4045
    purpose: Requests for new streetlights and evaluations, or if you're not sure who to call.
what_you_need:
  - The address closest to the light
  - The pole number (usually on a tag on the pole)
steps:
  online:
    - In Ask Raleigh, choose Transportation & Mobility, then Signs and Signals.
    - Set the location, give the pole number if you can see it, and submit.
  call:
    - Or report it to the utility directly - Duke Energy at 800-769-3766 or online, or Wake Electric at 855-280-1147 if Wake Electric serves the area.
notes:
  - The Signs and Signals form lists an estimated delivery time of 180 days. Reporting directly to the utility may be faster.
  - The City's frequently called numbers page lists different utility numbers (Duke Energy 800-474-6300; Wake Electric 800-777-9898) and still names the old "Progress Energy". The numbers here are from the City's streetlight program page. A volunteer should confirm which are current.
related: [report-traffic-signal-or-sign, report-pothole]
provenance:
  source_urls:
    - https://raleighnc.gov/transportation/services/streetlight-program
    - https://raleighnc.gov/ask-raleigh-fix-report-request/services/frequently-called-numbers
    - https://ask.raleighnc.gov/ask?id=sc_category&catalog_id=-1
  last_checked: 2026-11-04
  notes: Two City pages list different utility phone numbers; see notes.
