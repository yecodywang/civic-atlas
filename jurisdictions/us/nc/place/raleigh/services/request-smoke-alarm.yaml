id: request-smoke-alarm
title: Get a free smoke alarm installed
summary: >-
  The Raleigh Fire Department installs smoke alarms for residents. Ask at your local fire station
  or email the fire prevention office to schedule one.
provider: Raleigh Fire Department
category: find-help
aliases: [smoke alarm, smoke detector, free smoke alarm, fire alarm installation, home safety check]
channels:
  - type: email
    label: Fire prevention office
    email: fireprevention@raleighnc.gov
  - type: in-person
    label: Your local Raleigh fire station
    url: https://raleighnc.gov/places?type=656&name=
steps:
  online:
    - Email fireprevention@raleighnc.gov.
    - Say you'd like a smoke alarm installed, and include your address and the best way to reach you.
  in_person:
    - Find your local fire station with the station finder, then stop by and ask.
notes:
  - The Fire Department also holds neighborhood installation events with the American Red Cross. Ask about upcoming ones.
provenance:
  source_urls:
    - https://raleighnc.gov/fire/news/raleigh-fire-offers-free-smoke-alarm-installation
  last_checked: 2026-11-04
  notes: The source page is a news article with no publication date. Confirm the program is still running.
