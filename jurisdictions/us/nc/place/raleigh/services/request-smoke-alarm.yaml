id: request-smoke-alarm
title: Get a free smoke alarm installed or a home fire safety check
summary: >-
  Raleigh Fire installs up to two smoke alarms and does home fire safety checks for residents.
  Request one online, by email, or at your local fire station.
provider: Raleigh Fire Department
category: find-help
aliases: [smoke alarm, smoke detector, free smoke alarm, fire alarm installation, home safety check]
channels:
  - type: web
    label: Request a smoke alarm and home safety check (online form)
    url: https://raleighnc.gov/fire/services/smoke-alarms-and-home-fire-safety-checks
  - type: email
    label: Office of the Fire Marshal
    email: fireprevention@raleighnc.gov
  - type: phone
    label: Office of the Fire Marshal
    phone: 919-996-6392
  - type: in-person
    label: Your local Raleigh fire station
    url: https://raleighnc.gov/places?type=656&name=
steps:
  online:
    - Open the smoke alarm and home safety check page and scroll to the request form at the end.
    - Say whether you have a smoke alarm now and whether it works, then give your name, phone, email and address.
    - Pick a preferred date and submit. The Fire Department says it will call you within 24 hours to set a time.
  in_person:
    - Find your local fire station with the station finder, then stop by and ask.
notes:
  - Raleigh Fire installs up to two battery smoke alarms. It doesn't service hard-wired alarms; for those, contact an electrician or your alarm company.
  - Installations are done by firefighters or partners (the Red Cross or Raleigh CERT volunteers). The Fire Department also holds neighborhood installation events.
related: [request-fire-education-event, report-fire-hazard]
provenance:
  source_urls:
    - https://raleighnc.gov/fire/services/smoke-alarms-and-home-fire-safety-checks
    - https://raleighnc.gov/fire/news/raleigh-fire-offers-free-smoke-alarm-installation
  last_checked: 2026-11-04
