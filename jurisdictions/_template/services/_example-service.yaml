id: report-missed-collection
title: Report a missed garbage or recycling pickup
summary: One or two plain sentences on what this is and who it's for.
provider: Example City Solid Waste Services
provider_type: government        # government | nonprofit | other
category: fix-report             # fix-report | pay-manage | stay-informed | find-help | have-a-say | contact
core_skill: report-request       # know-who | report-request | stay-informed | accounts-payments
aliases: [trash, garbage, missed pickup]   # words people actually use
