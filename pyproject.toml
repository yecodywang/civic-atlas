[project]
name = "civic-atlas"
version = "0.1.0"
description = "An open, community-maintained catalog of how to use local government services, with a reference MCP server."
readme = "README.md"
requires-python = ">=3.11"
# Code is MIT; the bundled catalog data (jurisdictions/) is CC0-1.0.
license = "MIT AND CC0-1.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "civic-atlas contributors" }]
keywords = ["civic-tech", "open-data", "mcp", "local-government", "city-services", "311"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Sociology",
]
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.7",
    "ruamel-yaml>=0.18",
]

[project.scripts]
civic-atlas = "civic_atlas.cli:main"

[project.urls]
Repository = "https://github.com/yecodywang/civic-atlas"
Issues = "https://github.com/yecodywang/civic-atlas/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civic_atlas"]

# Bundle the catalog into the wheel so `uvx --from git+...` works without a clone.
[tool.hatch.build.targets.wheel.force-include]
"jurisdictions" = "civic_atlas/_data/jurisdictions"

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "jurisdictions",
    "schema",
    "tests",
    "README.md",
    "NOTICE.md",
    "LICENSE",
    "LICENSE-DATA",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The formatter manages line length; long strings and URLs are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
